<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nizam Project - Pembuat Film AI</title>
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom CSS for Scrollbars -->
    <style>
        /* Mengatur styling scrollbar kustom untuk sidebar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #312e81; /* indigo-900 */
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #4f46e5; /* indigo-600 */
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 overflow-hidden font-sans">
    
    <!-- Root element for React App -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        /* --- Komponen Ikon SVG (Pengganti Lucide-React untuk CDN) --- */
        const ClapperboardIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
            </svg>
        );

        const SparklesIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="m12 3-1.9 5.8a2 2 0 0 1-1.2 1.2L3 12l5.8 1.9a2 2 0 0 1 1.2 1.2L12 21l1.9-5.8a2 2 0 0 1 1.2-1.2L21 12l-5.8-1.9a2 2 0 0 1-1.2-1.2Z"/>
            </svg>
        );

        const UploadIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>
            </svg>
        );

        const FilmIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>
            </svg>
        );

        function App() {
            // State untuk semua pengaturan konfigurasi
            const [storyIdea, setStoryIdea] = useState('');
            const [visualStyle, setVisualStyle] = useState('realistis');
            const [aspectRatio, setAspectRatio] = useState('16:9');
            const [characterMode, setCharacterMode] = useState('konsisten');
            const [targetAudience, setTargetAudience] = useState('keluarga');
            const [jumlahVideo, setJumlahVideo] = useState('1');
            const [jenisSuara, setJenisSuara] = useState('laki-laki');
            const [intonasiSuara, setIntonasiSuara] = useState('normal');

            return (
                <div className="flex h-screen w-full bg-slate-950 text-slate-200 overflow-hidden font-sans">
                    
                    {}
                    {/* Left Sidebar */}
                    <aside className="w-80 md:w-96 bg-[#0f172a] border-r border-indigo-900/30 flex flex-col h-full shadow-[4px_0_24px_rgba(0,0,0,0.5)] z-10 flex-shrink-0">
                        
                        {/* Sidebar Header */}
                        <div className="h-16 flex items-center px-6 border-b border-indigo-900/30 bg-[#0f172a]/50">
                            <ClapperboardIcon className="w-6 h-6 text-indigo-400 mr-3" />
                            <h1 className="text-xl font-bold text-white tracking-wide">Nizam Project</h1>
                        </div>

                        {/* Sidebar Content (Scrollable) */}
                        <div className="flex-1 overflow-y-auto custom-scrollbar p-6">
                            <h2 className="text-lg font-semibold text-white mb-6 flex items-center">
                                <span className="bg-indigo-500 w-1 h-5 mr-3 rounded-full"></span>
                                Konfigurasi Cerita
                            </h2>

                            <div className="space-y-6">
                                {/* Story Idea Text Area */}
                                <div className="space-y-2">
                                    <label htmlFor="storyIdea" className="block text-sm font-medium text-slate-400">
                                        Ide Cerita
                                    </label>
                                    <textarea
                                        id="storyIdea"
                                        rows="4"
                                        className="w-full bg-[#0b1120] border border-indigo-900/50 rounded-lg p-3 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all resize-none shadow-inner"
                                        placeholder="Tulis ide cerita Anda di sini..."
                                        value={storyIdea}
                                        onChange={(e) => setStoryIdea(e.target.value)}
                                    ></textarea>
                                </div>

                                {}
                                {/* Dropdown Menus */}
                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium text-slate-400">Gaya Visual</label>
                                        <select 
                                            className="w-full bg-[#0b1120] border border-indigo-900/50 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none shadow-inner"
                                            value={visualStyle}
                                            onChange={(e) => setVisualStyle(e.target.value)}
                                        >
                                            <option value="realistis">Realistis</option>
                                            <option value="animasi_3d">Animasi 3D (Pixar Style)</option>
                                            <option value="2d_cel">2D Cel Shading</option>
                                            <option value="watercolor">Cat Air (Watercolor)</option>
                                        </select>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium text-slate-400">Rasio</label>
                                        <select 
                                            className="w-full bg-[#0b1120] border border-indigo-900/50 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none shadow-inner"
                                            value={aspectRatio}
                                            onChange={(e) => setAspectRatio(e.target.value)}
                                        >
                                            <option value="16:9">16:9 (Layar Lebar)</option>
                                            <option value="9:16">9:16 (Vertikal / Shorts)</option>
                                            <option value="1:1">1:1 (Persegi)</option>
                                        </select>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium text-slate-400">Mode Karakter</label>
                                        <select 
                                            className="w-full bg-[#0b1120] border border-indigo-900/50 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none shadow-inner"
                                            value={characterMode}
                                            onChange={(e) => setCharacterMode(e.target.value)}
                                        >
                                            <option value="konsisten">Konsisten (Reference based)</option>
                                            <option value="dinamis">Dinamis (Auto-generate)</option>
                                        </select>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium text-slate-400">Target Audiens</label>
                                        <select 
                                            className="w-full bg-[#0b1120] border border-indigo-900/50 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none shadow-inner"
                                            value={targetAudience}
                                            onChange={(e) => setTargetAudience(e.target.value)}
                                        >
                                            <option value="keluarga">Keluarga & Anak-anak</option>
                                            <option value="remaja">Remaja</option>
                                            <option value="dewasa">Dewasa</option>
                                            <option value="umum">Umum</option>
                                        </select>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium text-slate-400">Jumlah Video</label>
                                        <select 
                                            className="w-full bg-[#0b1120] border border-indigo-900/50 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none shadow-inner"
                                            value={jumlahVideo}
                                            onChange={(e) => setJumlahVideo(e.target.value)}
                                        >
                                            <option value="1">1 Video</option>
                                            <option value="2">2 Video</option>
                                            <option value="3">3 Video</option>
                                            <option value="4">4 Video</option>
                                            <option value="5">5 Video</option>
                                        </select>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium text-slate-400">Jenis Suara (Logat Indonesia)</label>
                                        <select 
                                            className="w-full bg-[#0b1120] border border-indigo-900/50 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none shadow-inner"
                                            value={jenisSuara}
                                            onChange={(e) => setJenisSuara(e.target.value)}
                                        >
                                            <option value="laki-laki">Laki-laki</option>
                                            <option value="perempuan">Perempuan</option>
                                            <option value="anak-anak">Anak-anak</option>
                                        </select>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="block text-sm font-medium text-slate-400">Intonasi Suara</label>
                                        <select 
                                            className="w-full bg-[#0b1120] border border-indigo-900/50 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 appearance-none shadow-inner"
                                            value={intonasiSuara}
                                            onChange={(e) => setIntonasiSuara(e.target.value)}
                                        >
                                            <option value="normal">Datar / Normal</option>
                                            <option value="semangat">Semangat / Ceria</option>
                                            <option value="sedih">Sedih / Dramatis</option>
                                            <option value="serius">Serius / Tegas</option>
                                            <option value="santai">Santai / Kasual</option>
                                        </select>
                                    </div>
                                </div>

                                {}
                                {/* File Upload Button */}
                                <div className="pt-2">
                                    <label className="block text-sm font-medium text-slate-400 mb-2">Unggah Gambar Karakter Utama</label>
                                    <div className="relative group cursor-pointer">
                                        <input 
                                            type="file" 
                                            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" 
                                            accept="image/*"
                                        />
                                        <div className="w-full bg-[#0b1120] border-2 border-dashed border-indigo-900/50 rounded-xl p-4 flex flex-col items-center justify-center space-y-2 group-hover:border-indigo-500 group-hover:bg-[#0f172a] transition-colors">
                                            <div className="p-2 bg-slate-800/50 rounded-full group-hover:bg-indigo-500/20 group-hover:text-indigo-400 transition-colors">
                                                <UploadIcon className="w-5 h-5 text-slate-400 group-hover:text-indigo-400" />
                                            </div>
                                            <span className="text-xs text-slate-400 group-hover:text-slate-300">Klik atau seret gambar ke sini</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Sidebar Footer - Submit Button */}
                        <div className="p-4 border-t border-indigo-900/30 bg-[#0f172a]">
                            <button className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition-all transform active:scale-95 shadow-lg shadow-indigo-900/20">
                                <SparklesIcon className="w-5 h-5" />
                                Minta Gemini
                            </button>
                        </div>
                    </aside>

                    {}
                    {/* Right Main Content (Preview Area) */}
                    <main className="flex-1 relative flex items-center justify-center bg-[#070b14] bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-[#0f172a] via-[#070b14] to-[#04060b]">
                        
                        {/* Background Grid Pattern */}
                        <div className="absolute inset-0 opacity-[0.02] bg-[linear-gradient(to_right,#818cf8_1px,transparent_1px),linear-gradient(to_bottom,#818cf8_1px,transparent_1px)] bg-[size:32px_32px]"></div>

                        <div className="flex flex-col items-center justify-center z-10 text-center animate-pulse duration-3000">
                            <div className="w-24 h-24 bg-[#0f172a] rounded-2xl flex items-center justify-center mb-6 shadow-2xl border border-indigo-900/30">
                                <FilmIcon className="w-12 h-12 text-indigo-500/70" />
                            </div>
                            <h2 className="text-2xl font-medium text-slate-400 mb-2">Siap Membuat Film</h2>
                            <p className="text-slate-500 text-sm max-w-sm">
                                Lengkapi konfigurasi cerita di panel samping dan minta AI untuk mulai menghasilkan karya Anda.
                            </p>
                        </div>
                    </main>
                    
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
